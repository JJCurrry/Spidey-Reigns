name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: 四道门（类型 / lint / 测试 / 覆盖率）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: Lint（含不变量 #1 / #7 红线检查）
        run: npm run lint

      - name: 格式化检查
        run: npm run format:check

      - name: 构建
        run: npm run build

      - name: 测试 + 覆盖率棘轮
        run: npm run coverage
